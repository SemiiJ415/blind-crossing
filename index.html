<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blind Crossing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

    <h1>Blind Crossing</h1>
    <div id="scoreboard">
    <span id="p1-score">0</span>
    <span class="score-divider">—</span>
    <span id="p2-score">0</span>
    </div>
    <div id="turn-indicator">Player 1's turn</div>
    <div id="game-message"></div>
    <div id="board"></div>
    <div id="detector-status">
    <div id="p1-detector"></div>
    <div id="p2-detector"></div>
    </div>
    <button id="detector-btn" style="display: none;">🔍 Use Detector</button>
    <button id="next-round-btn" style="display:none;">Next Round</button>
    <button id="play-again-btn" style="display: none;">Play Again</button>

  <script src="script.js"></script>
</body>
</html>
